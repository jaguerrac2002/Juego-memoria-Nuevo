<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REVOTYPE</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #93e0f5;
      margin: 0;
    }

    .card-container {
      display: flex;
      gap: 20px;
      perspective: 1000px;
    }

    .card {
      width: 200px;
      height: 300px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s;
      cursor: pointer;
    }

    .card.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(255, 1, 1, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
      font-weight: bold;
      color: rgb(0, 0, 0);
    }

    /* Carta 1 */
    .card1 .card-front {
      background-color: #FDF4A9;
    }

    .card1 .card-back {
      background-color: #FDF4A9;
      transform: rotateY(180deg);
    }

    /* Carta 2 */
    .card2 .card-front {
      background-color: #AAD4F3;
    }

    .card2 .card-back {
      background-color: #AAD4F3;
      transform: rotateY(180deg);
    }

    /* Carta 3 */
    .card3 .card-front {
      background-color: #F3A5B6;
      color: #000000;
    }

    .card3 .card-back {
      background-color: #F3A5B6;
      color: #000000;
      transform: rotateY(180deg);
    }
  </style>
</head>
<body>

  <div class="card-container">
    <div class="card card1">
      <div class="card-face card-front">TIPOGRAFIA</div>
      <div class="card-face card-back">RESPUESTA</div>

    </div>
    <div class="card card2">
      <div class="card-face card-front">GESTAL</div>
      <div class="card-face card-back">RESPUESTA</div>
    </div>
    <div class="card card3">
      <div class="card-face card-front">PREGUNTA</div>
      <div class="card-face card-back">RESPUESTA</div>
    </div>
  </div>

  <script>
    const cards = document.querySelectorAll('.card');

    cards.forEach(card => {
      card.addEventListener('click', () => {
        card.classList.toggle('is-flipped');
      });
    });
  </script>

</body>
</html>
